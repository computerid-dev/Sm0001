name: Build Study Mate APK

# Workflow ini otomatis membuat 1 file APK utama Study Mate lengkap dengan
# icon aplikasi, setiap kali ada push ke branch main, atau dijalankan manual
# lewat tab "Actions" > "Build Study Mate APK" > "Run workflow".

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  APP_PACKAGE: com.studymate.sm.cid
  APP_LABEL: "Study Mate"
  APP_VERSION: "1.0.0"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Cek proyek Flutter
        run: flutter doctor -v

      # Folder android/ sengaja TIDAK disimpan di repo, dibuat otomatis di
      # sini oleh Flutter agar workflow selalu memakai template Android
      # resmi & terbaru yang cocok dengan versi Flutter di atas.
      - name: Scaffold folder Android
        run: |
          flutter create --platforms=android --org com.studymate.sm --project-name cid _scaffold
          cp -r _scaffold/android ./android
          rm -rf _scaffold

      - name: Pasang Package Name & Nama Aplikasi
        run: |
          set -e
          echo "== Set applicationId & namespace =="
          find android -name "build.gradle" -o -name "build.gradle.kts" | while read -r f; do
            sed -i "s/applicationId = \".*\"/applicationId = \"${APP_PACKAGE}\"/" "$f" || true
            sed -i "s/applicationId \".*\"/applicationId \"${APP_PACKAGE}\"/" "$f" || true
            sed -i "s/namespace = \".*\"/namespace = \"${APP_PACKAGE}\"/" "$f" || true
            sed -i "s/namespace \".*\"/namespace \"${APP_PACKAGE}\"/" "$f" || true
          done

          echo "== Set nama aplikasi (label) di AndroidManifest =="
          find android -name "AndroidManifest.xml" | while read -r f; do
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"${APP_LABEL}\"/" "$f" || true
          done

          echo "== Pindahkan MainActivity ke package baru =="
          MAIN_ACT=$(find android/app/src/main -type f \( -name "MainActivity.kt" -o -name "MainActivity.java" \) | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            EXT="${MAIN_ACT##*.}"
            OLD_PKG=$(grep -m1 "^package " "$MAIN_ACT" | sed 's/package //; s/;//' | tr -d ' ')
            NEW_DIR="android/app/src/main/kotlin/$(echo "$APP_PACKAGE" | tr '.' '/')"
            if [ "$EXT" = "java" ]; then
              NEW_DIR="android/app/src/main/java/$(echo "$APP_PACKAGE" | tr '.' '/')"
            fi
            mkdir -p "$NEW_DIR"
            mv "$MAIN_ACT" "$NEW_DIR/MainActivity.$EXT"
            sed -i "s/package .*/package ${APP_PACKAGE};/" "$NEW_DIR/MainActivity.$EXT" 2>/dev/null || true
            if [ "$EXT" = "kt" ]; then
              sed -i "s/package .*/package ${APP_PACKAGE}/" "$NEW_DIR/MainActivity.$EXT"
            fi
            echo "MainActivity dipindah dari paket $OLD_PKG ke $APP_PACKAGE"
          fi

      - name: Ambil dependency Flutter
        run: flutter pub get

      - name: Generate icon aplikasi (muncul saat install)
        run: dart run flutter_launcher_icons

      - name: Build APK release
        run: flutter build apk --release --build-name=${{ env.APP_VERSION }} --build-number=1

      - name: Siapkan 1 file APK utama
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk "release-output/StudyMate-v${APP_VERSION}.apk"

      # Hanya 1 file APK utama yang diupload, bukan seluruh folder build.
      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyMate-v${{ env.APP_VERSION }}
          path: release-output/StudyMate-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Buat GitHub Release (opsional, untuk push ke main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ github.run_number }}
          name: Study Mate v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          files: release-output/StudyMate-v${{ env.APP_VERSION }}.apk
          fail_on_unmatched_files: true
        continue-on-error: true
